services:
  mysql:
    image: mysql:8.4
    container_name: wspm-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wspm_combo}
      MYSQL_USER: ${MYSQL_USER:-wspm_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - wspm_mysql_data:/var/lib/mysql

volumes:
  wspm_mysql_data:
